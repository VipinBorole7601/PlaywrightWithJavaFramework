name: Playwright Java CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test (${{ matrix.suite }} / ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        suite: [ smoke, regression ]
        browser: [ chromium, firefox, webkit ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile project
        run: mvn -B -ntp clean test-compile

      - name: Install Playwright browser (${{ matrix.browser }})
        run: mvn -B -ntp exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps ${{ matrix.browser }}"

      - name: Run ${{ matrix.suite }} suite on ${{ matrix.browser }}
        run: >
          mvn -B -ntp test
          -P${{ matrix.suite }}
          -Dheadless=true
          -Dbrowser=${{ matrix.browser }}
          -Dbrowsers=${{ matrix.browser }}

      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.suite }}-${{ matrix.browser }}
          path: |
            target/surefire-reports/**
            allure-results/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14

  merge-reports:
    name: Merge Allure Reports
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: shards

      - name: Aggregate allure-results
        run: |
          mkdir -p allure-results
          find shards -type d -name allure-results -exec sh -c 'cp -r "$1"/. allure-results/ 2>/dev/null || true' _ {} \;
          echo "Aggregated $(ls allure-results 2>/dev/null | wc -l) files"

      - name: Upload merged Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-merged
          path: allure-results/**
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release Artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build package
        run: mvn -B -ntp -DskipTests package

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/*.jar

